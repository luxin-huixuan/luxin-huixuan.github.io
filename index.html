.modal-overlay {

    background: var(--bg);
    position: relative;
}

.roll-slot::before, .roll-slot::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 40px;
    z-index: 2;
    pointer-events: none;
}

.roll-slot::before {
    top: 0;
    background: linear-gradient(180deg, var(--bg) 0%, transparent 100%);
}

.roll-slot::after {
    bottom: 0;
    background: linear-gradient(0deg, var(--bg) 0%, transparent 100%);
}

.roll-strip {
    position: absolute;
    width: 100%;
    transition: none;
}

.roll-item {
    height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.roll-item .roll-name { font-size: 22px; font-weight: 700; color: var(--ink); }
.roll-item .roll-unit { font-size: 12px; color: var(--muted); }
.roll-item .roll-major { font-size: 11px; color: var(--accent2); }

.roll-slot.locked {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(200,164,92,0.3);
}

.roll-slot.locked .roll-item .roll-name { color: var(--primary); }

/* 抽取结果 */
.result-section {
    margin-bottom: 24px;
}

.result-section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.result-section-title .badge { font-size: 11px; }

.result-expert-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    margin-bottom: 8px;
    transition: all var(--transition);
}

.result-expert-card:hover { border-color: var(--primary-light); box-shadow: var(--shadow-sm); }

.result-expert-card .re-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
}

.result-expert-card.alternate .re-avatar {
    background: linear-gradient(135deg, var(--muted), #94a3b8);
}

.result-expert-card .re-info { flex: 1; }
.result-expert-card .re-name { font-size: 14px; font-weight: 600; }
.result-expert-card .re-meta { font-size: 11px; color: var(--muted); }

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
}

.empty-state .empty-icon { font-size: 40px; opacity: 0.3; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 13px; }

/* 信息展示 */
.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.info-label { font-size: 11px; color: var(--muted); }
.info-value { font-size: 13px; font-weight: 600; color: var(--ink); }

/* 数据管理 */
.data-mgmt-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.data-mgmt-item {
    padding: 20px;
    background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.data-mgmt-icon {
    font-size: 28px;
}

.data-mgmt-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
}

.data-mgmt-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    flex: 1;
}

.data-mgmt-item .btn {
    margin-top: 8px;
}

.import-stats {
    background: #f8fafc;
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 12px;
    margin-top: 12px;
}

.import-stats-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: var(--ink);
}

.import-stat-item {
    font-size: 12px;
    color: var(--muted);
    padding: 3px 0;
}

@media (max-width: 768px) {
    .data-mgmt-grid { grid-template-columns: 1fr; }
}

/* 步骤条（通用） */
.steps-container { margin-bottom: 24px; }

.step-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 24px;
}

.step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
}

.step-item .step-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--rule);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    transition: all var(--transition);
}

.step-item.active .step-circle { background: var(--primary); border-color: var(--primary); color: #fff; }
.step-item.done .step-circle { background: var(--success); border-color: var(--success); color: #fff; }
.step-item.active { color: var(--primary); font-weight: 600; }

.step-connector {
    width: 50px;
    height: 2px;
    background: var(--rule);
    margin: 0 6px;
}

.step-connector.done { background: var(--success); }

/* 哈希码展示 */
.hash-display {
    font-family: "Consolas", "Monaco", monospace;
    font-size: 11px;
    color: var(--muted);
    background: #f8f9fb;
    padding: 8px 12px;
    border-radius: 4px;
    word-break: break-all;
    border: 1px dashed var(--rule);
}

/* 工具类 */
.text-center { text-align: center; }
.text-right { text-align: right; }
.text-muted { color: var(--muted); }
.text-sm { font-size: 12px; }
.text-lg { font-size: 16px; }
.text-bold { font-weight: 700; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mb-24 { margin-bottom: 24px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.flex-wrap { flex-wrap: wrap; }
.hidden { display: none !important; }
.w-full { width: 100%; }

/* Dashboard chart */
.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
}

.chart-container {
    min-height: 300px;
}

.chart-container.tall { min-height: 360px; }

/* 行内操作按钮组 */
.row-actions {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
}

.row-actions .btn { padding: 4px 8px; font-size: 11px; }

/* 联系电话隐藏 */
.phone-mask { font-family: monospace; }

/* 贴标签 */
.tag-group { display: flex; flex-wrap: wrap; gap: 4px; }

.tag {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    background: rgba(26,58,92,0.08);
    color: var(--primary);
}

/* 通知模拟 */
.notify-simulated {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}

@media (max-width: 1200px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .dashboard-grid { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
    .sidebar { width: 60px; }
    .sidebar-logo .logo-text, .nav-item span:not(.nav-icon), .sidebar-footer, .nav-group-title { display: none; }
    .stat-grid { grid-template-columns: 1fr; }
    .quick-actions { grid-template-columns: 1fr; }
    .content-area { padding: 12px; }
    .info-grid { grid-template-columns: 1fr; }
}

/* 登录页 */
.login-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f2840 0%, #1a3a5c 50%, #2a5278 100%);
}
.login-card {
    width: 400px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
}
.login-header {
    background: linear-gradient(135deg, #1a3a5c, #2a5278);
    padding: 32px 40px 24px;
    text-align: center;
}
.login-logo {
    width: 56px; height: 56px;
    border-radius: 12px;
    background: linear-gradient(135deg, #c8a45c, #e8923c);
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
}
.login-title { color: #fff; font-size: 20px; font-weight: 700; }
.login-sub { color: rgba(255,255,255,0.6); font-size: 11px; letter-spacing: 2px; margin-top: 4px; }
.login-body { padding: 32px 40px; }
.login-field { margin-bottom: 20px; }
.login-field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.login-field input {
    width: 100%; padding: 10px 14px;
    border: 1px solid var(--rule); border-radius: var(--radius);
    font-size: 14px; outline: none; transition: border-color var(--transition);
    box-sizing: border-box;
}
.login-field input:focus { border-color: var(--primary); }
.login-btn {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, #1a3a5c, #2a5278);
    color: #fff; border: none; border-radius: var(--radius);
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity var(--transition);
}
.login-btn:hover { opacity: 0.9; }
.login-error { color: var(--danger); font-size: 13px; text-align: center; min-height: 18px; margin-top: 12px; }
.login-footer { text-align: center; padding: 0 40px 28px; font-size: 12px; color: var(--muted); }
.logo-img { width: 100%; max-width: 180px; height: auto; display: block; }
.login-logo-img { width: 100%; max-width: 200px; height: auto; margin: 0 auto 12px; display: block; }

            localStorage.removeItem(this.KEYS.expertise);
            localStorage.setItem('luxin_data_version', String(this.DATA_VERSION));
        }

            localStorage.setItem(this.KEYS.experts, JSON.stringify([]));
        }

            localStorage.setItem(this.KEYS.projects, JSON.stringify([]));

            ]));

    getOperators: function() {
        return this.get('operators');
    },

    getTenderMethods: function() {
        var methods = this.get('tenderMethods');
        methods.sort(function(a, b) { return a.sort - b.sort; });
        return methods.map(function(m) { return m.name; });
    },

    getExpertise: function() {
        var list = this.get('expertise');
        list.sort(function(a, b) { return a.sort - b.sort; });
        return list.map(function(e) { return e.name; });
    },

    get: function(key) {
        return JSON.parse(localStorage.getItem(this.KEYS[key]) || '[]');
    },

    set: function(key, data) {
        localStorage.setItem(this.KEYS[key], JSON.stringify(data));
    },

    getById: function(key, id) {
        var data = this.get(key);
        return data.find(function(item) { return item.id === id; });
    },

    add: function(key, item) {
        var data = this.get(key);
        data.unshift(item);
        this.set(key, data);
        return item;
    },

    update: function(key, id, updates) {
        var data = this.get(key);
        var idx = data.findIndex(function(item) { return item.id === id; });
        if (idx >= 0) {
            Object.assign(data[idx], updates);
            this.set(key, data);
            return data[idx];
        }
        return null;
    },

    remove: function(key, id) {
        var data = this.get(key);
        data = data.filter(function(item) { return item.id !== id; });
        this.set(key, data);
    },

    getSettings: function() {
        return JSON.parse(localStorage.getItem(this.KEYS.settings) || '{}');
    },

    saveSettings: function(settings) {
        localStorage.setItem(this.KEYS.settings, JSON.stringify(settings));
    },

    genId: function(prefix) {
        return (prefix || 'ID') + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substr(2, 4).toUpperCase();
    },

    genProjectCode: function() {
        var year = new Date().getFullYear();
        var projects = this.get('projects');
        var count = projects.filter(function(p) { return p.code.indexOf('LX-' + year) === 0; }).length + 1;
        return 'LX-' + year + '-' + String(count).padStart(3, '0');
    },

    genSelectionCode: function() {
        var d = new Date();
        var dateStr = d.getFullYear() + this.pad(d.getMonth() + 1) + this.pad(d.getDate());
        var selections = this.get('selections');
        var count = selections.filter(function(s) { return s.code.indexOf('CQ-' + dateStr) === 0; }).length + 1;
        return 'CQ-' + dateStr + '-' + String(count).padStart(3, '0');
    },

    genHash: function(data) {
        var str = JSON.stringify(data) + Date.now() + Math.random();
        var hash = 0;
        for (var i = 0; i < str.length; i++) {
            var char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        var hex = '';
        var seed = Math.abs(hash);
        for (var j = 0; j < 64; j++) {
            seed = (seed * 9301 + 49297) % 233280;
            hex += (seed % 16).toString(16);
        }
        return hex;
    },

    pad: function(n) { return n < 10 ? '0' + n : '' + n; },

    addAuditLog: function(action, projectName, details) {
        var d = new Date();
        var opName = '-';
        try { opName = Auth.getCurrentUser().name || '-'; } catch(e) {}
        var log = {
            id: this.genId('L'),
            timestamp: d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()) + ' ' +
                       this.pad(d.getHours()) + ':' + this.pad(d.getMinutes()) + ':' + this.pad(d.getSeconds()),
            operator: opName,
            action: action,
            projectName: projectName || '-',
            details: details
        };
        this.add('auditLogs', log);
    }
};

            delete_conflict: 'badge-danger', settings: 'badge-default'
        };
        return '<span class="badge ' + (badgeMap[action] || 'badge-default') + '">' + UI.getActionLabel(action) + '</span>';
    },

    expertiseTags: function(arr) {
        return arr.map(function(e) { return '<span class="tag">' + e + '</span>'; }).join('');
    },

    paginationHTML: function(current, total, pageSize, onChange) {
        var totalPages = Math.ceil(total / pageSize);
        if (totalPages <= 1) return '';
        var html = '<div class="pagination"><span>共 ' + total + ' 条，' + current + '/' + totalPages + ' 页</span><div class="pagination-pages">';
        html += '<button class="page-btn" ' + (current <= 1 ? 'disabled' : '') + ' onclick="' + onChange + '(' + (current - 1) + ')">‹</button>';
        var start = Math.max(1, current - 2);
        var end = Math.min(totalPages, current + 2);
        if (start > 1) { html += '<button class="page-btn" onclick="' + onChange + '(1)">1</button>'; if (start > 2) html += '<span style="padding:0 4px;">...</span>'; }
        for (var i = start; i <= end; i++) {
            html += '<button class="page-btn ' + (i === current ? 'active' : '') + '" onclick="' + onChange + '(' + i + ')">' + i + '</button>';
        }
        if (end < totalPages) { if (end < totalPages - 1) html += '<span style="padding:0 4px;">...</span>'; html += '<button class="page-btn" onclick="' + onChange + '(' + totalPages + ')">' + totalPages + '</button>'; }
        html += '<button class="page-btn" ' + (current >= totalPages ? 'disabled' : '') + ' onclick="' + onChange + '(' + (current + 1) + ')">›</button>';
        html += '</div></div>';
        return html;
    }
};

        Object.assign(this.filters, changes);
        this.currentPage = 1;
        this.renderTable();
    },

    onSort: function(field) {
        if (this.sortBy === field) {
            this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
            this.sortBy = field;
            this.sortDir = 'asc';
        }
        this.renderTable();
    },

    getFiltered: function() {
        var list = Store.get('experts');
        var f = this.filters;
        list = list.filter(function(e) {
            if (f.keyword) {
                var kw = f.keyword.toLowerCase();
                if (e.name.toLowerCase().indexOf(kw) < 0 && e.unit.toLowerCase().indexOf(kw) < 0 && e.phone.indexOf(kw) < 0) return false;
            }
            if (f.expertise && e.expertise.indexOf(f.expertise) < 0) return false;
            if (f.status && e.status !== f.status) return false;
            return true;
        });
        var self = this;
        list.sort(function(a, b) {
            var va = a[self.sortBy] || '';
            var vb = b[self.sortBy] || '';
            if (Array.isArray(va)) va = va.join(',');
            if (Array.isArray(vb)) vb = vb.join(',');
            if (va < vb) return self.sortDir === 'asc' ? -1 : 1;
            if (va > vb) return self.sortDir === 'asc' ? 1 : -1;
            return 0;
        });
        return list;
    },

    renderTable: function() {
        var all = this.getFiltered();

    parseCSV: function(file) {
        if (!file.name.toLowerCase().endsWith('.csv')) {
            UI.toast('请上传CSV格式文件', 'error');
            return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
            var buffer = e.target.result;
            var text;
            try {
                var decoder = new TextDecoder('utf-8');
                text = decoder.decode(buffer);
                if (text.indexOf('\uFFFD') >= 0) {
                    decoder = new TextDecoder('gbk');
                    text = decoder.decode(buffer);
                }
            } catch(err) {
                text = String.fromCharCode.apply(null, new Uint8Array(buffer));
            }
            text = text.replace(/^\uFEFF/, '');
            var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
            if (lines.length < 2) {
                UI.toast('文件内容为空或只有表头', 'error');
                return;
            }
            var headers = Experts.parseCSVLine(lines[0]);
            var experts = [];
            var errors = [];
            var expList = Store.getExpertise();
            for (var i = 1; i < lines.length; i++) {
                var cols = Experts.parseCSVLine(lines[i]);
                if (cols.length < 4) {
                    errors.push('第' + (i+1) + '行：数据列数不足');
                    continue;
                }
                var name = cols[0].trim();
                var unit = cols[1].trim();
                var expStr = cols[2].trim().replace(/^"|"$/g, '');
                var expertise = expStr.split(/[,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s; });
                var title = cols[3].trim();
                var phone = cols[4] ? cols[4].trim() : '';
                var status = cols[5] ? cols[5].trim() : '在库';
                if (status === '在库') status = 'active';
                else if (status === '回避') status = 'recusal';
                if (!name) {
                    errors.push('第' + (i+1) + '行：姓名为空');
                    continue;
                }
                experts.push({
                    id: Store.genId('E'),
                    name: name,
                    unit: unit,
                    expertise: expertise,
                    title: title,
                    phone: phone,
                    status: status,
                    createdAt: new Date().getFullYear() + '-' + Store.pad(new Date().getMonth()+1) + '-' + Store.pad(new Date().getDate())
                });
            }
            var resultDiv = document.getElementById('importResult');
            if (experts.length === 0) {
                if (resultDiv) {
                    resultDiv.innerHTML = '<div style="color:var(--danger);font-size:13px;">⚠ 没有可导入的数据' + (errors.length ? '<br>错误：' + errors.join('；') : '') + '</div>';
                }
                return;
            }
            for (var j = 0; j < experts.length; j++) {
                Store.add('experts', experts[j]);
            }
            Store.addAuditLog('create_expert', '-', '批量导入' + experts.length + '条评委数据');
            if (resultDiv) {
                resultDiv.innerHTML = '<div style="color:var(--success);font-size:13px;font-weight:600;">✓ 成功导入 ' + experts.length + ' 条评委数据</div>' +
                    (errors.length ? '<div style="color:var(--warning);font-size:12px;margin-top:4px;">部分跳过：' + errors.join('；') + '</div>' : '');
            }
            UI.toast('成功导入' + experts.length + '条评委数据', 'success');
            Experts.renderTable();
        };
        reader.readAsArrayBuffer(file);
    },

    parseCSVLine: function(line) {
        var result = [];
        var current = '';
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (ch === '"') {
                if (inQuotes && line[i+1] === '"') {
                    current += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (ch === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += ch;
            }
        }
        result.push(current);
        return result;
    },

    exportData: function() {
        var list = this.getFiltered();
        if (list.length === 0) {
            UI.toast('当前没有可导出的评委数据', 'error');
            return;
        }
        var statusMap = { active: '在库', paused: '暂停', recused: '回避' };
        var csv = '\uFEFF姓名,所在单位,专业领域,职称/职务,联系电话,状态,入库时间\n';
        list.forEach(function(e) {
            var expertise = (e.expertise || []).join(',');
            if (expertise.indexOf(',') >= 0) expertise = '"' + expertise + '"';
            var name = e.name.indexOf(',') >= 0 ? '"' + e.name + '"' : e.name;
            var unit = e.unit.indexOf(',') >= 0 ? '"' + e.unit + '"' : e.unit;
            var title = (e.title || '').indexOf(',') >= 0 ? '"' + e.title + '"' : (e.title || '');
            csv += [name, unit, expertise, title, e.phone || '', statusMap[e.status] || e.status, e.createdAt || ''].join(',') + '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var link = document.createElement('a');

        link.click();

        UI.toast('成功导出' + list.length + '条评委数据', 'success');

        var selections = Store.get('selections').filter(function(s) { return s.projectId === p.id; });

        var wb = XLSX.utils.book_new();

        var data = [
            ['鲁信·慧选 评委随机抽取系统 — 项目详情'],
            [],
            ['项目编号', p.code],
            ['项目名称', p.name],
            ['招标方式', p.tenderMethod],
            ['预算金额', p.budget ? (p.budget + '元') : '未填写'],
            ['项目负责人', manager ? (manager.name + '（' + manager.unit + '）') : '未指定'],
            ['项目状态', statusMap[p.status] || p.status],
            ['创建时间', p.createdAt],
            ['项目描述', p.description || '无'],
            ['所需评委专业及人数', reqStr],
            ['回避单位列表', p.avoidUnits && p.avoidUnits.length ? p.avoidUnits.join('、') : '无'],
            [],
            ['一、项目信息如上'],
            [],
            ['二、抽取结果'],
            ['序号', '抽取编号', '抽取时间', '操作人', '评委姓名', '所在单位', '专业领域', '职称/职务', '评委类型', '确定状态']
        ];
        var seq = 0;
        var isConfirmed = p.status === 'confirmed';
        if (selections.length === 0) {
            data.push(['', '', '', '', '暂无抽取记录', '', '', '', '', '']);
        } else {
            selections.forEach(function(s) {
                if (!s.confirmedIds) s.confirmedIds = [];
                if (!s.confirmedAltIds) s.confirmedAltIds = [];
                var selExperts = s.selectedIds.map(function(eid) { return Store.getById('experts', eid); }).filter(function(e) { return e; });
                var altExperts = s.alternateIds.map(function(eid) { return Store.getById('experts', eid); }).filter(function(e) { return e; });
                selExperts.forEach(function(e) {
                    seq++;
                    var isJudgeConfirmed = s.confirmedIds.indexOf(e.id) >= 0;
                    var confirmStatus = isConfirmed ? (isJudgeConfirmed ? '已确定' : '未参与') : (isJudgeConfirmed ? '已确定' : '未确认');
                    data.push([seq, s.code, s.timestamp, s.operator, e.name, e.unit,
                        Array.isArray(e.expertise) ? e.expertise.join('、') : e.expertise, e.title || '', '正式评委', confirmStatus]);
                });
                altExperts.forEach(function(e) {
                    seq++;
                    var isAltConfirmed = s.confirmedAltIds.indexOf(e.id) >= 0;
                    var confirmStatus = isConfirmed ? (isAltConfirmed ? '已确定' : '未参与') : (isAltConfirmed ? '已确定' : '未确认');
                    data.push([seq, s.code, s.timestamp, s.operator, e.name, e.unit,
                        Array.isArray(e.expertise) ? e.expertise.join('、') : e.expertise, e.title || '', '候补评委', confirmStatus]);

    exportAll: function() {

            UI.toast('当前没有可导出的项目', 'error');

        }

    _doExportAll: function(list) {
        var statusMap = { pending: '待抽取', extracted: '已抽取', completed: '已完成', confirmed: '已确定' };
        var wb = XLSX.utils.book_new();

        var headers = ['序号', '项目编号', '项目名称', '招标方式', '预算金额', '项目负责人', '所需评委', '项目状态', '创建时间', '抽取次数', '正式评委数', '候补评委数', '抽取编号', '抽取时间', '操作人', '评委姓名', '所在单位', '专业领域', '职称/职务', '评委类型', '确定状态'];
        var data = [headers];
        var merges = [];
        var rowIdx = 1;

        list.forEach(function(p, idx) {
            var manager = p.managerId ? Store.getById('experts', p.managerId) : null;
            var reqStr = p.requirements.map(function(r) {
                return (Array.isArray(r.expertise) ? r.expertise.join('＋') : r.expertise) + '(' + r.count + '人)';
            }).join('、');
            var selections = Store.get('selections').filter(function(s) { return s.projectId === p.id; });
            var totalSel = 0, totalAlt = 0;
            var allJudges = [];
            selections.forEach(function(s) {
                totalSel += s.selectedIds.length;
                totalAlt += s.alternateIds.length;
                s.selectedIds.forEach(function(eid) { var e = Store.getById('experts', eid); if(e) allJudges.push({expert: e, sel: s, type: '正式评委'}); });
                s.alternateIds.forEach(function(eid) { var e = Store.getById('experts', eid); if(e) allJudges.push({expert: e, sel: s, type: '候补评委'}); });
            });

            var projectInfo = [
                idx + 1, p.code, p.name, p.tenderMethod,
                p.budget ? (p.budget + '元') : '未填写',
                manager ? manager.name : '未指定',
                reqStr, statusMap[p.status] || p.status,
                p.createdAt, selections.length, totalSel, totalAlt
            ];

            if (allJudges.length === 0) {
                data.push(projectInfo.concat(['', '', '', '', '', '', '', '', '']));
                rowIdx++;
            } else {
                var isConfirmed = p.status === 'confirmed';
                allJudges.forEach(function(j, jIdx) {
                    var e = j.expert;
                    var s = j.sel;
                    if (!s.confirmedIds) s.confirmedIds = [];
                    if (!s.confirmedAltIds) s.confirmedAltIds = [];
                    var isJudgeConfirmed = j.type === '正式评委' ? s.confirmedIds.indexOf(e.id) >= 0 : s.confirmedAltIds.indexOf(e.id) >= 0;
                    var confirmStatus = isConfirmed ? (isJudgeConfirmed ? '已确定' : '未参与') : (isJudgeConfirmed ? '已确定' : '未确认');
                    var judgeInfo = [
                        s.code, s.timestamp, s.operator,
                        e.name, e.unit,
                        Array.isArray(e.expertise) ? e.expertise.join('、') : e.expertise,
                        e.title || '', j.type, confirmStatus
                    ];
                    if (jIdx === 0) {
                        data.push(projectInfo.concat(judgeInfo));
                    } else {
                        data.push(['', '', '', '', '', '', '', '', '', '', '', ''].concat(judgeInfo));
                    }
                });
                if (allJudges.length > 1) {
                    for (var c = 0; c < 12; c++) {
                        merges.push({ s: { r: rowIdx, c: c }, e: { r: rowIdx + allJudges.length - 1, c: c } });
                    }
                }
                rowIdx += allJudges.length;
            }
        });

        var ws = XLSX.utils.aoa_to_sheet(data);
        ws['!merges'] = merges;
        ws['!cols'] = [
            { wch: 6 }, { wch: 18 }, { wch: 25 }, { wch: 12 }, { wch: 15 }, { wch: 12 }, { wch: 30 }, { wch: 10 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 },
            { wch: 20 }, { wch: 20 }, { wch: 10 }, { wch: 12 }, { wch: 25 }, { wch: 15 }, { wch: 15 }, { wch: 10 }, { wch: 10 }
        ];
        XLSX.utils.book_append_sheet(wb, ws, '项目清单及抽取结果');

        var now = new Date();
        var dateStr = now.getFullYear() + '' + Store.pad(now.getMonth()+1) + Store.pad(now.getDate());
        var fileName = '项目清单_' + dateStr + '.xlsx';
        XLSX.writeFile(wb, fileName);
        Store.addAuditLog('export_projects', '-', '导出项目清单（' + list.length + '个项目）');
        UI.toast('成功导出' + list.length + '个项目清单', 'success');
    },

    showManagerList: function() {
        this.filterManager(document.getElementById('pf_manager_input').value);
        document.getElementById('pf_manager_list').style.display = 'block';
        var selectedId = document.getElementById('pf_manager').value;
        if (selectedId) {
            var expert = Store.getById('experts', selectedId);
            if (expert && !document.getElementById('pf_manager_input').value) {
                document.getElementById('pf_manager_input').value = expert.name + '（' + (Array.isArray(expert.expertise)?expert.expertise.join('、'):expert.expertise) + '）';
            }
        }
    },

    filterManager: function(keyword) {
        var list = document.getElementById('pf_manager_list');
        var experts = Store.get('experts');
        var selectedId = document.getElementById('pf_manager').value;
        keyword = (keyword || '').toLowerCase().trim();

        var filtered = keyword ? experts.filter(function(e) {
            return e.name.toLowerCase().indexOf(keyword) >= 0 ||
                   (Array.isArray(e.expertise) ? e.expertise.join(',') : e.expertise).toLowerCase().indexOf(keyword) >= 0 ||
                   e.unit.toLowerCase().indexOf(keyword) >= 0;
        }) : experts;

        var html = '';
        if (filtered.length === 0) {
            html = '<div class="searchable-select-item" style="color:var(--muted);cursor:default;">无匹配评委</div>';
        } else {
            filtered.forEach(function(e) {
                var isSelected = e.id === selectedId;
                html += '<div class="searchable-select-item' + (isSelected?' selected':'') + '" ' +
                    'onmousedown="event.preventDefault();" ' +
                    'onclick="Projects.selectManager(\'' + e.id + '\',\'' + e.name.replace(/'/g,"\\'") + '\',\'' + (Array.isArray(e.expertise)?e.expertise.join('、'):e.expertise).replace(/'/g,"\\'") + '\')">' +
                    e.name + '（' + (Array.isArray(e.expertise)?e.expertise.join('、'):e.expertise) + '）' +
                    (e.unit ? ' · ' + e.unit : '') +
                '</div>';
            });
        }
        list.innerHTML = html;
        list.style.display = 'block';
    },

    selectManager: function(id, name, expertise) {
        document.getElementById('pf_manager').value = id;
        document.getElementById('pf_manager_input').value = name + '（' + expertise + '）';
        document.getElementById('pf_manager_list').style.display = 'none';
    },

    saveForm: function() {
        var id = document.getElementById('pf_id').value;
        var name = document.getElementById('pf_name').value.trim();
        var budget = parseInt(document.getElementById('pf_budget').value);
        var code = document.getElementById('pf_code').value.trim();

        if (!code) { UI.toast('请输入项目编号', 'error'); return false; }
        if (!name) { UI.toast('请输入项目名称', 'error'); return false; }
        if (!budget || budget <= 0) { UI.toast('请输入有效的预算金额', 'error'); return false; }

        var allProjects = Store.get('projects');
        var duplicate = allProjects.some(function(p) { return p.code === code && p.id !== id; });
        if (duplicate) { UI.toast('项目编号"' + code + '"已存在，请使用其他编号', 'error'); return false; }

        var requirements = [];
        var rows = document.querySelectorAll('#reqContainer .req-row');
        var hasError = false;
        rows.forEach(function(row) {
            var expArr = [];
            row.querySelectorAll('.checkbox-item.checked input').forEach(function(cb) { expArr.push(cb.value); });
            var cnt = parseInt(row.querySelector('.req-count').value);
            if (expArr.length === 0 || !cnt || cnt < 1) { hasError = true; return; }
            requirements.push({ expertise: expArr, count: cnt });
        });
        if (hasError) { UI.toast('请检查专业需求：每组需选择至少一个专业领域并填写人数', 'error'); return false; }
        if (requirements.length === 0) { UI.toast('请至少添加一项专业需求', 'error'); return false; }

        var avoidUnits = [];
        document.querySelectorAll('.pf_avoid:checked').forEach(function(cb) { avoidUnits.push(cb.value); });

        var managerId = document.getElementById('pf_manager').value;

        var data = {
            name: name,
            code: code,
            tenderMethod: document.getElementById('pf_method').value,
            budget: budget,
            status: id ? Store.getById('projects', id).status : 'pending',
            description: document.getElementById('pf_desc').value.trim(),
            requirements: requirements,
            avoidUnits: avoidUnits,
            managerId: managerId
        };

        if (id) {
            Store.update('projects', id, data);
            Store.addAuditLog('modify', name, '修改项目信息：' + name);
            UI.toast('项目信息已更新', 'success');
        } else {
            data.id = Store.genId('P');
            data.createdAt = new Date().getFullYear() + '-' + Store.pad(new Date().getMonth()+1) + '-' + Store.pad(new Date().getDate());
            Store.add('projects', data);
            Store.addAuditLog('create_project', name, '新建招标项目 ' + data.code);
            UI.toast('项目已创建', 'success');
        }
        UI.hideModal();
        this.renderTable();
        return false;
    },

    confirmDelete: function(id) {
        var p = Store.getById('projects', id);
        UI.confirm({
            title: '删除项目',
            body: '确定要删除项目 <strong>' + p.name + '</strong>（' + p.code + '）吗？此操作不可恢复。',
            danger: true,
            okText: '删除',
            onConfirm: function() {
                Store.remove('projects', id);
                Store.addAuditLog('modify', p.name, '删除项目：' + p.name + '（' + p.code + '）');
                UI.toast('项目已删除', 'success');
                Projects.renderTable();
            }
        });
    },

    voidProject: function(id) {
        var p = Store.getById('projects', id);
        if (!p) return;
        UI.confirm({
            title: '项目作废',
            body: '<div style="font-size:14px;">' +
                '<p>确定要将项目 <strong>' + p.name + '</strong>（' + p.code + '）作废吗？</p>' +
                '<div style="margin:12px 0;padding:10px;background:#fef2f2;border-radius:6px;color:var(--danger);">' +
                '<p>⚠️ 作废后：</p>' +
                '<ul style="margin-left:20px;margin-top:4px;">' +
                '<li>项目状态变更为"已作废"</li>' +
                '<li>项目编码将追加"作废"标识</li>' +
                '<li>该项目不可再编辑、抽取或删除</li>' +
                '<li>已抽取的评委数据保留但不可修改</li>' +
                '</ul>' +
                '</div>' +
                '<p style="color:var(--danger);font-weight:600;">此操作不可恢复！</p>' +
                '</div>',
            danger: true,
            okText: '确认作废',
            onConfirm: function() {
                p.status = 'voided';
                p.code = p.code + '作废';
                Store.update('projects', p.id, p);
                Store.addAuditLog('void_project', p.name, '项目作废：' + p.name + '（编码变更为' + p.code + '）');
                UI.toast('项目已作废', 'success');
                Projects.renderTable();
            }
        });
    }
};

window.Projects = Projects;

/* ============================================
   9. 评委抽取（核心功能）
   ============================================ */
var Selection = {
    step: 1,
    selectedProject: null,
    conditions: { expertise: {}, alternateCount: 0, avoidUnits: [] },
    candidatePool: [],
    selectedIds: [],
    alternateIds: [],
    isAnimating: false,
    selectionCode: '',

    render: function(container) {
        this.step = 1;
        this.selectedProject = null;
        this.conditions = { reqCounts: [], alternateCount: 0, avoidUnits: [] };
        this.candidatePool = [];
        this.selectedIds = [];
        this.alternateIds = [];
        this.isAnimating = false;

        container.innerHTML = '<div id="selectionContainer"></div>';
        this.renderStep();
    },

    renderStep: function() {
        var container = document.getElementById('selectionContainer');
        if (!container) return;

        var steps = [
            { num: 1, label: '选择项目' },
            { num: 2, label: '设置条件' },
            { num: 3, label: '筛选评委池' },
            { num: 4, label: '执行抽取' },
            { num: 5, label: '抽取结果' }
        ];

        var stepBar = '<div class="step-bar">';
        steps.forEach(function(s, i) {
            var cls = '';
            if (Selection.step > s.num) cls = 'done';
            else if (Selection.step === s.num) cls = 'active';
            stepBar += '<div class="step-item ' + cls + '"><span class="step-circle">' + (Selection.step > s.num ? '✓' : s.num) + '</span><span>' + s.label + '</span></div>';
            if (i < steps.length - 1) stepBar += '<div class="step-connector ' + (Selection.step > s.num ? 'done' : '') + '"></div>';
        });
        stepBar += '</div>';

        var content = '';
        switch(this.step) {
            case 1: content = this.renderStep1(); break;
            case 2: content = this.renderStep2(); break;
            case 3: content = this.renderStep3(); break;
            case 4: content = this.renderStep4(); break;
            case 5: content = this.renderStep5(); break;
        }

        container.innerHTML =
            '<div class="card"><div class="card-header"><span class="card-title">评委抽取</span></div>' +
            '<div class="card-body">' + stepBar + content + '</div></div>';
    },

    renderStep1: function() {
        var projects = Store.get('projects').filter(function(p) { return p.status === 'pending'; });

        var html = '<div class="form-group"><label class="form-label">选择招标项目</label>' +
            '<div class="form-hint mb-16">请选择需要抽取评委的招标项目</div>';

        if (projects.length === 0) {
            html += '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无可抽取的项目，请先创建项目</div></div>';
        } else {
            html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
            projects.forEach(function(p) {
                var reqStr = p.requirements.map(function(r){return (Array.isArray(r.expertise)?r.expertise.join('＋'):r.expertise)+'('+r.count+'人)';}).join('、');
                var selected = Selection.selectedProject && Selection.selectedProject.id === p.id;
                html += '<div style="border:2px solid ' + (selected?'var(--primary)':'var(--rule)') + ';border-radius:var(--radius);padding:16px;cursor:pointer;' + (selected?'background:rgba(26,58,92,0.04);':'') + '" onclick="Selection.selectProject(\'' + p.id + '\')">' +
                    '<div style="display:flex;justify-content:space-between;align-items:start;">' +
                        '<div><div style="font-weight:600;font-size:14px;">' + p.name + '</div>' +
                        '<div style="font-size:11px;color:var(--muted);margin-top:4px;">编号：' + p.code + ' · ' + p.tenderMethod + '</div></div>' +
                        (selected ? '<span class="badge badge-primary">已选</span>' : '') +
                    '</div>' +
                    '<div style="font-size:12px;color:var(--muted);margin-top:8px;">预算：' + UI.formatMoney(p.budget) + ' · 需求：' + reqStr + '</div>' +
                    '</div>';
            });
            html += '</div>';
        }

        html += '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">' +
            '<button class="btn btn-primary btn-lg" ' + (!this.selectedProject ? 'disabled' : '') + ' onclick="Selection.goStep(2)">下一步</button>' +
        '</div>';
        return html;
    },

    selectProject: function(id) {
        this.selectedProject = Store.getById('projects', id);
        this.conditions.avoidUnits = this.selectedProject.avoidUnits.slice();
        this.conditions.managerRequired = 'no';
        this.renderStep();
    },

    startWithProject: function(projectId) {
        Router.navigate('selection');
        setTimeout(function() {
            Selection.selectProject(projectId);
            Selection.goStep(2);
        }, 100);
    },

    renderStep2: function() {
        var p = this.selectedProject;
        var self = this;
        if (!self.conditions.reqCounts) self.conditions.reqCounts = [];
        p.requirements.forEach(function(r, idx) {
            if (self.conditions.reqCounts[idx] === undefined) {
                self.conditions.reqCounts[idx] = r.count;
            }
        });
        var settings = Store.getSettings();
        var totalForCalc = self.conditions.reqCounts.reduce(function(a,b){return a+parseInt(b);},0);
        if (!self.conditions.alternateCount || self.conditions.alternateCount < 1) {
            self.conditions.alternateCount = Math.max(2, Math.ceil(totalForCalc * settings.alternateRatio));
        }
        var html = '<div class="info-grid mb-16" style="background:#f8f9fb;padding:12px;border-radius:var(--radius);">' +
            '<div class="info-item"><span class="info-label">项目名称</span><span class="info-value">' + p.name + '</span></div>' +
            '<div class="info-item"><span class="info-label">项目编号</span><span class="info-value" style="font-family:monospace;">' + p.code + '</span></div>' +
        '</div>';

        html += '<div class="form-group"><label class="form-label">各需求组抽取人数</label><div class="form-hint mb-8">根据项目需求设置各组的评委抽取数量</div>';

        p.requirements.forEach(function(r, idx) {
            var expLabel = Array.isArray(r.expertise) ? r.expertise.join('＋') : r.expertise;
            var currentVal = self.conditions.reqCounts[idx] !== undefined ? self.conditions.reqCounts[idx] : r.count;
            html += '<div class="form-row" style="align-items:center;margin-bottom:8px;">' +
                '<div style="flex:1;font-size:13px;font-weight:600;">需求组' + (idx+1) + '：' + expLabel + '</div>' +
                '<div style="width:120px;"><input type="number" class="form-input" id="cond_req_' + idx + '" value="' + currentVal + '" min="1" max="20" onchange="Selection.updateReqCount(' + idx + ', this.value)"></div>' +
                '<span style="font-size:12px;color:var(--muted);">人</span>' +
            '</div>';
        });

        var totalNeed = self.conditions.reqCounts.reduce(function(a,b){return a+parseInt(b);},0) || p.requirements.reduce(function(s,r){return s+r.count;},0);

        html += '<div style="padding:8px 12px;background:rgba(26,58,92,0.06);border-radius:var(--radius);font-size:12px;color:var(--primary);font-weight:600;margin-top:8px;">共需抽取评委：' + totalNeed + ' 人</div>';

        var settings = Store.getSettings();
        var suggestedAlternate = Math.max(2, Math.ceil(totalNeed * settings.alternateRatio));
        html += '</div><div class="form-group"><label class="form-label">候补人数</label>' +
            '<input type="number" class="form-input" style="width:120px;" id="cond_alternate" value="' + (this.conditions.alternateCount||suggestedAlternate) + '" min="0" max="10" onchange="Selection.conditions.alternateCount=parseInt(this.value)">' +
            '<div class="form-hint">建议候补人数：' + suggestedAlternate + ' 人（按' + (settings.alternateRatio*100) + '%比例计算）</div></div>';

        var manager = p.managerId ? Store.getById('experts', p.managerId) : null;
        if (manager) {
            html += '<div class="form-group"><label class="form-label">负责人必中</label>' +
                '<div style="display:flex;align-items:center;gap:8px;">' +
                    '<select class="form-select" id="cond_managerRequired" style="width:auto;" onchange="Selection.conditions.managerRequired = this.value">' +
                        '<option value="no" ' + (this.conditions.managerRequired!=='yes'?'selected':'') + '>不要求负责人必中</option>' +
                        '<option value="yes" ' + (this.conditions.managerRequired==='yes'?'selected':'') + '>负责人必须抽中</option>' +
                    '</select>' +
                    '<span style="font-size:12px;color:var(--muted);">负责人：' + manager.name + '（' + manager.unit + '）</span>' +
                '</div>' +
                '<div class="form-hint">选择"必须抽中"时，负责人将优先加入抽取结果</div>' +
            '</div>';
        }

        html += '<div class="form-group"><label class="form-label">回避单位</label>' +
            '<div class="form-hint mb-8">以下单位已从项目回避列表自动关联，抽取时将自动排除相关评委</div>';
        if (this.conditions.avoidUnits.length === 0) {
            html += '<div style="font-size:12px;color:var(--muted);padding:8px 0;">无回避单位</div>';
        } else {
            html += '<div class="tag-group">';
            this.conditions.avoidUnits.forEach(function(u, i) {
                html += '<span class="badge badge-warning" style="cursor:pointer;" onclick="Selection.removeAvoidUnit(' + i + ')">' + u + ' ✕</span> ';
            });
            html += '</div>';
        }
        html += '</div>';

        html += '<div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px;">' +
            '<button class="btn btn-lg" onclick="Selection.goStep(1)">上一步</button>' +
            '<button class="btn btn-primary btn-lg" onclick="Selection.goStep(3)">下一步</button>' +
        '</div>';
        return html;
    },

    updateReqCount: function(idx, val) {
        if (!this.conditions.reqCounts) this.conditions.reqCounts = [];
        this.conditions.reqCounts[idx] = parseInt(val) || 0;
    },

    removeAvoidUnit: function(idx) {
        this.conditions.avoidUnits.splice(idx, 1);
        this.renderStep();
    },

    buildCandidatePool: function() {
        var experts = Store.get('experts');
        var conflicts = Store.get('conflicts').filter(function(c) { return c.status === 'active'; });
        var avoidUnits = this.conditions.avoidUnits;
        var p = this.selectedProject;

        return experts.filter(function(e) {
            if (e.status !== 'active') return false;
            var hasExpertise = p.requirements.some(function(r) {
                var expArr = Array.isArray(r.expertise) ? r.expertise : [r.expertise];
                return expArr.some(function(ex) { return e.expertise.indexOf(ex) >= 0; });
            });
            if (!hasExpertise) return false;
            if (avoidUnits.indexOf(e.unit) >= 0) return false;
            var hasConflict = conflicts.some(function(c) { return c.expertId === e.id; });
            if (hasConflict) return false;
            return true;
        });
    },

    renderStep3: function() {
        this.candidatePool = this.buildCandidatePool();

        if (!this.conditions.reqCounts) this.conditions.reqCounts = [];
        var needed = this.conditions.reqCounts.reduce(function(a,b){return a+parseInt(b);},0);
        if (!needed) {
            this.selectedProject.requirements.forEach(function(r, idx) {
                if (Selection.conditions.reqCounts[idx] === undefined) {
                    Selection.conditions.reqCounts[idx] = r.count;
                }
            });
            needed = this.conditions.reqCounts.reduce(function(a,b){return a+parseInt(b);},0);
        }
        needed += this.conditions.alternateCount || 0;

        var settings = Store.getSettings();
        var minRequired = needed * settings.minCandidateMultiple;
        var isSufficient = this.candidatePool.length >= minRequired;

        var html = '<div class="info-grid mb-16" style="background:#f8f9fb;padding:12px;border-radius:var(--radius);">' +
            '<div class="info-item"><span class="info-label">项目</span><span class="info-value">' + this.selectedProject.name + '</span></div>' +
            '<div class="info-item"><span class="info-label">需抽取人数</span><span class="info-value">' + needed + ' 人（正式+候补）</span></div>' +
        '</div>';

        html += '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px;">' +
            '<div class="stat-card ' + (isSufficient?'success':'') + '"><div class="stat-value">' + this.candidatePool.length + '</div><div class="stat-label">候选评委总数</div></div>' +
            '<div class="stat-card ' + (isSufficient?'success':'accent') + '"><div class="stat-value">' + minRequired + '</div><div class="stat-label">最少要求人数（' + settings.minCandidateMultiple + '倍）</div></div>' +
            '<div class="stat-card ' + (isSufficient?'success':'accent') + '"><div class="stat-value">' + (isSufficient?'充足':'不足') + '</div><div class="stat-label">候选池充裕度</div></div>' +
        '</div>';

        html += '<div class="card mb-16"><div class="card-header"><span class="card-title">各需求组候选分布</span></div><div class="card-body no-pad"><div class="table-wrap"><table class="data-table"><thead><tr><th>需求组</th><th>专业领域</th><th>候选人数</th><th>需抽取</th><th>状态</th></tr></thead><tbody>';
        var self = this;
        this.selectedProject.requirements.forEach(function(r, idx) {
            var expLabel = Array.isArray(r.expertise) ? r.expertise.join('＋') : r.expertise;
            var expArr = Array.isArray(r.expertise) ? r.expertise : [r.expertise];
            var count = self.candidatePool.filter(function(e) {
                return expArr.some(function(ex) { return e.expertise.indexOf(ex) >= 0; });
            }).length;
            var need = self.conditions.reqCounts[idx] || r.count;
            var ok = count >= need * settings.minCandidateMultiple;
            html += '<tr><td>需求组' + (idx+1) + '</td><td>' + expLabel + '</td><td>' + count + '</td><td>' + need + '</td><td>' + (ok?'<span class="badge badge-success">充足</span>':'<span class="badge badge-warning">偏少</span>') + '</td></tr>';
        });
        html += '</tbody></table></div></div></div>';

        if (!isSufficient) {
            html += '<div class="notify-simulated" style="background:#fffbeb;border-color:#fde68a;color:#b45309;"><span>⚠</span><span>候选评委人数不足最低要求（' + minRequired + '人），建议增加候选评委或调整抽取条件。</span></div>';
        }

        html += '<div style="max-height:300px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--radius);margin-bottom:20px;">' +
            '<table class="data-table"><thead><tr><th>姓名</th><th>所在单位</th><th>专业</th><th>职称</th></tr></thead><tbody>';
        this.candidatePool.forEach(function(e) {
            html += '<tr><td>' + e.name + '</td><td>' + e.unit + '</td><td><div class="tag-group">' + UI.expertiseTags(e.expertise) + '</div></td><td>' + e.title + '</td></tr>';
        });
        html += '</tbody></table></div>';

        var effectivePool = this.candidatePool.length;
        if (this.conditions.managerRequired === 'yes' && this.selectedProject.managerId) {
            var managerInPool = this.candidatePool.some(function(e) { return e.id === self.selectedProject.managerId; });
            if (!managerInPool) effectivePool += 1;
        }
        html += '<div style="display:flex;justify-content:space-between;gap:8px;">' +
            '<button class="btn btn-lg" onclick="Selection.goStep(2)">上一步</button>' +
            '<button class="btn btn-accent btn-lg" onclick="Selection.goStep(4)" ' + (effectivePool < needed ? 'disabled title="候选人数不足"' : '') + '>执行随机抽取</button>' +
        '</div>';
        return html;
    },

    renderStep4: function() {
        var total = (this.conditions.reqCounts||[]).reduce(function(a,b){return a+parseInt(b);},0) + (this.conditions.alternateCount||0);
        var html = '<div class="draw-container">' +
            '<div style="margin-bottom:24px;">' +
                '<div style="font-size:16px;font-weight:700;color:var(--primary);">即将执行随机抽取</div>' +
                '<div style="font-size:13px;color:var(--muted);margin-top:8px;">共抽取 ' + total + ' 位评委（正式' + (this.conditions.reqCounts||[]).reduce(function(a,b){return a+parseInt(b);},0) + '人 + 候补' + (this.conditions.alternateCount||0) + '人）</div>' +
                '<div style="font-size:12px;color:var(--muted);margin-top:4px;">候选池：' + this.candidatePool.length + ' 人</div>' +
            '</div>';

        if (this.isAnimating) {
            html += '<div class="roll-container" id="rollContainer"></div>';
            html += '<div style="font-size:13px;color:var(--accent2);margin-top:16px;animation:pulse 1s infinite;">正在随机抽取中...</div>';
        } else {
            html += '<div style="padding:40px 20px;font-size:48px;opacity:0.2;">🎲</div>';
            html += '<div style="font-size:14px;color:var(--muted);margin-top:12px;">点击下方按钮开始抽取</div>';
        }

        html += '<div style="margin-top:30px;">' +
            (this.isAnimating ? '' : '<button class="btn btn-accent btn-lg" onclick="Selection.startDraw()">开始抽取</button>') +
        '</div>';

        if (this.selectedIds.length > 0) {
            html += '<div style="margin-top:20px;">' + this.renderResults() + '</div>';
        }

        html += '</div>';

        if (this.isAnimating) {
            setTimeout(function() { Selection.startRollAnimation(); }, 100);
        }

        return html;
    },

    startDraw: function() {
        this.isAnimating = true;
        this.selectedIds = [];
        this.alternateIds = [];
        this.selectionCode = Store.genSelectionCode();
        this.renderStep();
    },

    startRollAnimation: function() {
        var pool = this.candidatePool.slice();
        var totalNeed = (this.conditions.reqCounts||[]).reduce(function(a,b){return a+parseInt(b);},0) + (this.conditions.alternateCount||0);

        var slots = [];
        for (var i = 0; i < Math.min(totalNeed, 5); i++) {
            slots.push(i);
        }

        var container = document.getElementById('rollContainer');
        if (!container) return;

        container.innerHTML = slots.map(function(idx) {
            return '<div class="roll-slot" id="rollSlot_' + idx + '"><div class="roll-strip" id="rollStrip_' + idx + '"></div></div>';
        }).join('');

        var self = this;
        var rollStrips = slots.map(function(idx) {
            return document.getElementById('rollStrip_' + idx);
        });

        var itemHeight = 200;
        var rollCount = 30;

        rollStrips.forEach(function(strip, idx) {
            var items = '';
            for (var i = 0; i < rollCount; i++) {
                var randomExpert = pool[Math.floor(Math.random() * pool.length)];
                items += '<div class="roll-item"><div class="roll-name">' + randomExpert.name + '</div>' +
                    '<div class="roll-unit">' + randomExpert.unit + '</div>' +
                    '<div class="roll-major">' + (randomExpert.expertise[0]||'') + '</div></div>';
            }
            strip.innerHTML = items;
            strip.style.transform = 'translateY(0)';
        });

        var speeds = slots.map(function(_, idx) {
            return 15 + idx * 5;
        });

        var positions = slots.map(function() { return 0; });
        var locks = slots.map(function() { return false; });

        var animationTimer = setInterval(function() {
            var allLocked = true;
            slots.forEach(function(idx) {
                if (locks[idx]) return;
                allLocked = false;
                positions[idx] += speeds[idx];
                if (positions[idx] > itemHeight * rollCount) {
                    positions[idx] = positions[idx] % (itemHeight * rollCount);
                }
                rollStrips[idx].style.transform = 'translateY(-' + positions[idx] + 'px)';
            });

            slots.forEach(function(idx, i) {
                if (!locks[idx] && speeds[i] <= 2) {
                    locks[idx] = true;
                    document.getElementById('rollSlot_' + idx).classList.add('locked');
                    speeds[i] = 0;
                }
                speeds[i] = Math.max(0, speeds[i] - 0.5);
            });

            if (allLocked) {
                clearInterval(animationTimer);
                setTimeout(function() { Selection.finalizeDraw(); }, 500);
            }
        }, 30);
    },

    finalizeDraw: function() {
        var pool = this.candidatePool.slice();
        var selected = [];
        var self = this;

        var managerId = this.selectedProject.managerId;
        var managerRequired = this.conditions.managerRequired === 'yes' && managerId;
        var managerUsed = false;
        if (managerRequired) {
            if (selected.indexOf(managerId) < 0) {
                selected.push(managerId);
                managerUsed = true;
            }
        }

        this.selectedProject.requirements.forEach(function(r, idx) {
            var need = self.conditions.reqCounts[idx] || r.count;
            if (managerUsed && need > 0) {
                need -= 1;
                managerUsed = false;
            }
            var expArr = Array.isArray(r.expertise) ? r.expertise : [r.expertise];
            var candidates = pool.filter(function(e) {
                if (selected.indexOf(e.id) >= 0) return false;
                return expArr.some(function(ex) { return e.expertise.indexOf(ex) >= 0; });
            });
            for (var i = 0; i < need && candidates.length > 0; i++) {
                var randIdx = Math.floor(Math.random() * candidates.length);
                selected.push(candidates[randIdx].id);
                candidates.splice(randIdx, 1);
            }
        });

        var alternateCount = this.conditions.alternateCount || 0;
        var alternatePool = pool.filter(function(e) { return selected.indexOf(e.id) < 0; });
        var alternates = [];
        for (var j = 0; j < alternateCount && alternatePool.length > 0; j++) {
            var rIdx = Math.floor(Math.random() * alternatePool.length);
            alternates.push(alternatePool[rIdx].id);
            alternatePool.splice(rIdx, 1);
        }

        this.selectedIds = selected;
        this.alternateIds = alternates;
        this.isAnimating = false;

        var hashData = {
            code: this.selectionCode,
            projectId: this.selectedProject.id,
            conditions: this.conditions,
            selectedIds: selected,
            alternateIds: alternates,
            timestamp: new Date().toISOString()
        };
        var hash = Store.genHash(hashData);

        var d = new Date();
        var timestamp = d.getFullYear() + '-' + Store.pad(d.getMonth()+1) + '-' + Store.pad(d.getDate()) + ' ' +
                       Store.pad(d.getHours()) + ':' + Store.pad(d.getMinutes()) + ':' + Store.pad(d.getSeconds());

        var selection = {
            id: Store.genId('S'),
            code: this.selectionCode,
            projectId: this.selectedProject.id,
            projectName: this.selectedProject.name,
            conditions: JSON.parse(JSON.stringify(this.conditions)),
            candidatePool: this.candidatePool.map(function(e) { return e.id; }),
            selectedIds: selected,
            alternateIds: alternates,
            timestamp: timestamp,
            operator: '管理员',
            hash: hash,
            status: 'normal'
        };

        Store.add('selections', selection);
        Store.update('projects', this.selectedProject.id, { status: 'extracted' });
        Store.addAuditLog('extract', this.selectedProject.name,
            '执行评委抽取，正式' + selected.length + '人+候补' + alternates.length + '人，抽取编号' + this.selectionCode);

        this.step = 5;
        this.renderStep();
        UI.toast('抽取完成！', 'success');
    },

    renderResults: function() {
        var self = this;
        var selectedExperts = this.selectedIds.map(function(id) { return Store.getById('experts', id); });
        var alternateExperts = this.alternateIds.map(function(id) { return Store.getById('experts', id); });
        var managerId = this.selectedProject.managerId;

                if (!reason) { UI.toast('请输入重抽原因', 'error'); return; }
                Store.addAuditLog('re_extract', Selection.selectedProject.name,

    reset: function() {

            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
            script.onload = function() { self._doExport(list); };
            script.onerror = function() { UI.toast('Excel库加载失败，请检查网络', 'error'); };

        ];
        var merges = [];
        var rowIdx = 3;

        list.forEach(function(p, idx) {
            var manager = p.managerId ? Store.getById('experts', p.managerId) : null;

            var totalFormal = 0, totalConfirmed = 0, totalAlt = 0, totalAltConfirmed = 0;

                totalConfirmed += s.confirmedIds.length;
                totalAlt += s.alternateIds.length;

                s.selectedIds.forEach(function(eid) {

                });

                totalFormal, totalAlt, totalConfirmed, totalAltConfirmed,
                totalAllConfirmed + '/' + totalFormal,
                statusMap[p.status] || p.status
            ];

            if (allRows.length === 0) {
                data.push(projectInfo.concat(['', '', '', '', '', '']));
                rowIdx++;
            } else {
                allRows.forEach(function(r, rIdx) {
                    var e = r.expert;
                    var confirmStatus = p.status === 'confirmed'
                        ? (r.confirmed ? '已确定' : '未参与')
                        : (r.confirmed ? '已确定' : '未确认');
                    var judgeInfo = [
                        e.name, e.unit,
                        Array.isArray(e.expertise) ? e.expertise.join('、') : e.expertise,
                        e.title || '', r.type, confirmStatus
                    ];
                    if (rIdx === 0) {
                        data.push(projectInfo.concat(judgeInfo));
                    } else {
                        data.push(['', '', '', '', '', '', '', '', '', '', ''].concat(judgeInfo));
                    }
                });
                if (allRows.length > 1) {
                    for (var c = 0; c < 11; c++) {
                        merges.push({ s: { r: rowIdx, c: c }, e: { r: rowIdx + allRows.length - 1, c: c } });
                    }
                }
                rowIdx += allRows.length;
            }
        });

        var ws = XLSX.utils.aoa_to_sheet(data);
        ws['!merges'] = merges;
        ws['!cols'] = [
            { wch: 6 }, { wch: 18 }, { wch: 25 }, { wch: 12 }, { wch: 12 },
            { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 12 }, { wch: 10 },
            { wch: 12 }, { wch: 25 }, { wch: 15 }, { wch: 15 }, { wch: 10 }, { wch: 10 }
        ];
        XLSX.utils.book_append_sheet(wb, ws, '评委确定清单');

        var now = new Date();
        var dateStr = now.getFullYear() + '' + Store.pad(now.getMonth()+1) + Store.pad(now.getDate());
        XLSX.writeFile(wb, '评委确定清单_' + dateStr + '.xlsx');
        Store.addAuditLog('export_confirmation', '-', '导出评委确定清单（' + list.length + '个项目）');
        UI.toast('成功导出' + list.length + '个项目评委确定清单', 'success');
    },

    confirmJudge: function(projectId, selectionId, expertId, type) {
        var p = Store.getById('projects', projectId);
        if (!p || p.status === 'confirmed') return;
        var selections = Store.get('selections');
        var sel = selections.filter(function(s) { return s.id === selectionId; })[0];
        if (!sel) return;

        var confirmKey = type === 'alternate' ? 'confirmedAltIds' : 'confirmedIds';
        if (!sel[confirmKey]) sel[confirmKey] = [];
        if (sel[confirmKey].indexOf(expertId) >= 0) {
            UI.toast('该评委已确定，无需重复操作', 'warning');
            return;
        }

        var e = Store.getById('experts', expertId);
        sel[confirmKey].push(expertId);
        Store.update('selections', sel.id, sel);
        Store.addAuditLog('confirm_judge', p.name, '确认评委：' + (e ? e.name : expertId));
        UI.toast('评委"' + (e ? e.name : '') + '"已确认', 'success');
        this.showDetail(projectId);
    },

    cancelConfirm: function(projectId, selectionId, expertId, type) {
        var p = Store.getById('projects', projectId);
        if (!p || p.status === 'confirmed') return;
        var selections = Store.get('selections');
        var sel = selections.filter(function(s) { return s.id === selectionId; })[0];
        if (!sel) return;

        var confirmKey = type === 'alternate' ? 'confirmedAltIds' : 'confirmedIds';
        if (!sel[confirmKey]) sel[confirmKey] = [];
        var idx = sel[confirmKey].indexOf(expertId);
        if (idx < 0) {
            UI.toast('该评委未确认，无需取消', 'warning');
            return;
        }

        var e = Store.getById('experts', expertId);
        sel[confirmKey].splice(idx, 1);
        Store.update('selections', sel.id, sel);
        Store.addAuditLog('cancel_confirm_judge', p.name, '取消确认评委：' + (e ? e.name : expertId));
        UI.toast('评委"' + (e ? e.name : '') + '"已取消确认', 'success');
        this.showDetail(projectId);
    },

    finalConfirm: function(id) {
        var p = Store.getById('projects', id);
        if (!p || p.status === 'confirmed') return;
        var selections = Store.get('selections').filter(function(s) { return s.projectId === p.id; });
        var totalFormal = 0, totalConfirmed = 0, totalAlt = 0, totalAltConfirmed = 0;
        selections.forEach(function(s) {
            if (!s.confirmedIds) s.confirmedIds = [];
            if (!s.confirmedAltIds) s.confirmedAltIds = [];
            totalFormal += s.selectedIds.length;
            totalConfirmed += s.confirmedIds.length;
            totalAlt += s.alternateIds.length;
            totalAltConfirmed += s.confirmedAltIds.length;
        });
        var totalAllConfirmed = totalConfirmed + totalAltConfirmed;

        if (totalAllConfirmed !== totalFormal) {
            UI.toast('总确认人数（' + totalAllConfirmed + '）与正式评委总数（' + totalFormal + '）不一致，无法最终确定', 'error');
            return;
        }

        UI.confirm({
            title: '最终确定',
            body: '<div style="font-size:14px;">' +
                '<p>确定要<strong>最终锁定</strong>项目 <strong>' + p.name + '</strong> 的评委名单吗？</p>' +
                '<div style="margin:12px 0;padding:10px;background:#fefce8;border-radius:6px;">' +
                '<div>正式评委确认：' + totalConfirmed + '/' + totalFormal + '</div>' +
                '<div>候补评委确认：' + totalAltConfirmed + '/' + totalAlt + '</div>' +
                '<div style="margin-top:4px;color:var(--success);"><strong>总确认人数：' + totalAllConfirmed + ' / ' + totalFormal + ' ✅</strong></div>' +
                '</div>' +
                '<p style="color:var(--danger);font-weight:600;">⚠️ 最终确定后，所有评委的确认状态及数据均不可再修改！</p>' +
                '</div>',
            danger: true,
            okText: '确认锁定',
            onConfirm: function() {
                p.status = 'confirmed';
                Store.update('projects', p.id, p);
                Store.addAuditLog('confirm_judges', p.name, '最终确定评委：正式' + totalConfirmed + '名、候补' + totalAltConfirmed + '名，共' + totalAllConfirmed + '名');
                UI.toast('评委已最终确定，项目已锁定', 'success');
                Confirmation.renderTable();
                Confirmation.showDetail(id);
            }
        });
    }
};

window.Confirmation = Confirmation;

                        '<button class="btn btn-ghost" onclick="Conflicts.showForm(\'' + c.id + '\')">编辑</button>' +

                    '</div>' +
                    '<div class="form-row">' +
                        '<div class="form-group"><label class="form-label">回避原因<span class="req">*</span></label>' +

                        '</div>' +

                        '</div>' +
                    '</div>' +
                    '<div class="form-group"><label class="form-label">状态</label>' +
                        '<select class="form-select" id="cf_status"><option value="active" ' + (c&&c.status==='active'?'selected':'') + '>生效中</option><option value="inactive" ' + (c&&c.status==='inactive'?'selected':'') + '>已解除</option></select>' +
                    '</div>' +
                    '<div class="form-group"><label class="form-label">备注说明</label>' +
                        '<textarea class="form-textarea" id="cf_note" placeholder="详细说明回避原因...">' + (c?c.note:'') + '</textarea>' +
                    '</div>' +
                '</form>' +

    onExpertChange: function() {
        var id = document.getElementById('cf_expert').value;
        if (id) {
            var e = Store.getById('experts', id);
            if (e) document.getElementById('cf_unit').value = e.unit;
        }
    },

    saveForm: function() {
        var id = document.getElementById('cf_id').value;
        var expertId = document.getElementById('cf_expert').value;
        var unit = document.getElementById('cf_unit').value.trim();
        var date = document.getElementById('cf_date').value;

        if (!expertId) { UI.toast('请选择评委', 'error'); return false; }
        if (!unit) { UI.toast('请输入关联单位', 'error'); return false; }
        if (!date) { UI.toast('请选择生效时间', 'error'); return false; }

        var e = Store.getById('experts', expertId);
        var reason = document.getElementById('cf_reason').value;
        var reasonLabel = CONFLICT_REASONS.find(function(r) { return r.value === reason; }).label;

        var data = {
            expertId: expertId,
            expertName: e.name,
            unit: unit,
            reason: reason,
            reasonLabel: reasonLabel,
            effectiveDate: date,
            status: document.getElementById('cf_status').value,
            note: document.getElementById('cf_note').value.trim()
        };

        if (id) {
            Store.update('conflicts', id, data);
            Store.addAuditLog('edit_conflict', '-', '编辑回避规则：' + e.name + '（' + unit + '）— ' + reasonLabel);
            UI.toast('回避规则已更新', 'success');
        } else {
            data.id = Store.genId('CF');
            Store.add('conflicts', data);
            if (data.status === 'active') {
                Store.update('experts', expertId, { status: 'recused' });
            }
            Store.addAuditLog('create_conflict', '-', '新增回避规则：' + e.name + '（' + unit + '）— ' + reasonLabel);
            UI.toast('回避规则已添加', 'success');
        }
        UI.hideModal();
        this.renderTable();
        return false;
    },

    toggleStatus: function(id) {
        var c = Store.getById('conflicts', id);
        var newStatus = c.status === 'active' ? 'inactive' : 'active';
        Store.update('conflicts', id, { status: newStatus });
        if (newStatus === 'active') {
            Store.update('experts', c.expertId, { status: 'recused' });
        } else {
            var hasOtherActive = Store.get('conflicts').some(function(cf) { return cf.expertId === c.expertId && cf.status === 'active' && cf.id !== id; });
            if (!hasOtherActive) Store.update('experts', c.expertId, { status: 'active' });
        }
        UI.toast(newStatus === 'active' ? '回避规则已启用' : '回避规则已解除', 'success');
        this.renderTable();
    },

    confirmDelete: function(id) {
        var c = Store.getById('conflicts', id);
        UI.confirm({
            title: '删除回避规则',
            body: '确定要删除 <strong>' + c.expertName + '</strong> 的回避规则吗？',
            danger: true, okText: '删除',
            onConfirm: function() {
                Store.remove('conflicts', id);
                var hasOtherActive = Store.get('conflicts').some(function(cf) { return cf.expertId === c.expertId && cf.status === 'active'; });
                if (!hasOtherActive) Store.update('experts', c.expertId, { status: 'active' });
                Store.addAuditLog('delete_conflict', '-', '删除回避规则：' + c.expertName + '（' + c.unit + '）');
                UI.toast('回避规则已删除', 'success');
                Conflicts.renderTable();
            }
        });
    }
};

window.Conflicts = Conflicts;

        var code = codeMatch ? codeMatch[1] : '';
        var selection = Store.get('selections').find(function(s) { return s.code === code; });

        var snapshotCard = document.getElementById('selectionSnapshotCard');
        var snapshotBody = document.getElementById('snapshotBody');

        if (!selection) {
            snapshotBody.innerHTML = '<div class="empty-state"><div class="empty-text">未找到对应的抽取快照</div></div>';
            snapshotCard.style.display = 'block';
            return;
        }

        var experts = Store.get('experts');
        var selectedExperts = selection.selectedIds.map(function(id) { return experts.find(function(e) { return e.id === id; }); });
        var alternateExperts = selection.alternateIds.map(function(id) { return experts.find(function(e) { return e.id === id; }); });

        var html = '<div class="info-grid mb-16">' +
            '<div class="info-item"><span class="info-label">抽取编号</span><span class="info-value" style="font-family:monospace;">' + selection.code + '</span></div>' +
            '<div class="info-item"><span class="info-label">抽取时间</span><span class="info-value">' + selection.timestamp + '</span></div>' +
            '<div class="info-item"><span class="info-label">操作人员</span><span class="info-value">' + selection.operator + '</span></div>' +
            '<div class="info-item"><span class="info-label">候选池人数</span><span class="info-value">' + selection.candidatePool.length + ' 人</span></div>' +
        '</div>';

        html += '<div class="form-group"><span class="form-label">抽取条件</span><div style="font-size:12px;padding:8px 0;">';
        if (selection.conditions.reqCounts) {
            var proj = Store.getById('projects', selection.projectId);
            if (proj && proj.requirements) {
                proj.requirements.forEach(function(r, idx) {
                    var expLabel = Array.isArray(r.expertise) ? r.expertise.join('＋') : r.expertise;
                    html += '<span class="tag">需求组' + (idx+1) + '（' + expLabel + '）: ' + (selection.conditions.reqCounts[idx]||r.count) + '人</span> ';
                });
            } else {
                selection.conditions.reqCounts.forEach(function(cnt, idx) {
                    html += '<span class="tag">需求组' + (idx+1) + ': ' + cnt + '人</span> ';
                });
            }
        }
        html += '<span class="tag">候补: ' + (selection.conditions.alternateCount||0) + '人</span>';
        if (selection.conditions.avoidUnits && selection.conditions.avoidUnits.length) {
            html += '<br><span style="color:var(--muted);">回避单位：' + selection.conditions.avoidUnits.join('、') + '</span>';
        }
        html += '</div></div>';

        html += '<div class="form-group"><span class="form-label">中签结果</span></div>';
        html += '<table class="data-table"><thead><tr><th>序号</th><th>姓名</th><th>所在单位</th><th>专业</th><th>角色</th></tr></thead><tbody>';
        selectedExperts.forEach(function(e, i) {
            if (e) html += '<tr><td>' + (i+1) + '</td><td>' + e.name + '</td><td>' + e.unit + '</td><td>' + e.expertise.join('、') + '</td><td><span class="badge badge-success">正式</span></td></tr>';
        });
        alternateExperts.forEach(function(e, i) {
            if (e) html += '<tr><td>' + (i+1) + '</td><td>' + e.name + '</td><td>' + e.unit + '</td><td>' + e.expertise.join('、') + '</td><td><span class="badge badge-info">候补</span></td></tr>';
        });
        html += '</tbody></table>';

        html += '<div class="form-group mt-16"><span class="form-label">候选评委池</span><div style="font-size:12px;color:var(--muted);padding:8px 0;">';
        var poolExperts = selection.candidatePool.map(function(id) { return experts.find(function(e) { return e.id === id; }); }).filter(function(e) { return e; });
        html += poolExperts.map(function(e) { return e.name + '(' + e.unit + ')'; }).join('、');
        html += '</div></div>';

        html += '<div class="form-group"><span class="form-label">哈希校验码</span><div class="hash-display">' + selection.hash + '</div><div class="form-hint">此码用于验证抽取结果不可篡改</div></div>';

        snapshotBody.innerHTML = html;
        snapshotCard.style.display = 'block';
        snapshotCard.scrollIntoView({ behavior: 'smooth' });
    },

    exportReport: function() {
        var logs = this.getFiltered();
        var csv = '\uFEFF时间,操作人员,操作类型,关联项目,操作详情\n';
        logs.forEach(function(l) {
            csv += l.timestamp + ',' + l.operator + ',' + UI.getActionLabel(l.action) + ',' + l.projectName + ',"' + l.details + '"\n';
        });
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '审计报告_' + new Date().getFullYear() + Store.pad(new Date().getMonth()+1) + Store.pad(new Date().getDate()) + '.csv';
        link.click();
        UI.toast('审计报告已导出', 'success');
    }
};

    moveMethod: function(id, dir) {
        var methods = Store.get('tenderMethods');
        methods.sort(function(a, b) { return a.sort - b.sort; });
        var idx = methods.findIndex(function(m) { return m.id === id; });
        if (idx < 0) return;
        var target = idx + dir;
        if (target < 0 || target >= methods.length) return;
        var tmp = methods[idx].sort;
        methods[idx].sort = methods[target].sort;
        methods[target].sort = tmp;
        Store.set('tenderMethods', methods);
        Settings.render(document.getElementById('contentArea'));
    },
