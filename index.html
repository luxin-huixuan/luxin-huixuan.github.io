            UI.toast('专业领域已更新', 'success');
        } else {
            var e = { id: Store.genId('EX'), name: name, sort: sort };
            Store.add('expertise', e);
            Store.addAuditLog('settings', '-', '新增专业领域：' + name);
            UI.toast('专业领域已添加', 'success');
        }
        UI.hideModal();
        Settings.render(document.getElementById('contentArea'));
        return false;
    },

    deleteExpertise: function(id) {
        var e = Store.getById('expertise', id);
        if (!e) return;
        UI.confirm({
            title: '删除专业领域',
            body: '确定要删除专业领域 <strong>' + e.name + '</strong> 吗？',
            danger: true,
            okText: '删除',
            onConfirm: function() {
                Store.remove('expertise', id);
                Store.addAuditLog('settings', '-', '删除专业领域：' + e.name);
                UI.toast('专业领域已删除', 'success');
                Settings.render(document.getElementById('contentArea'));
            }
        });
    },

    moveExpertise: function(id, dir) {
        var list = Store.get('expertise');
        list.sort(function(a, b) { return a.sort - b.sort; });
        var idx = list.findIndex(function(e) { return e.id === id; });
        if (idx < 0) return;
        var target = idx + dir;
        if (target < 0 || target >= list.length) return;
        var tmp = list[idx].sort;
        list[idx].sort = list[target].sort;
        list[target].sort = tmp;
        Store.set('expertise', list);
        Settings.render(document.getElementById('contentArea'));
    },

    exportData: function() {
        var data = {
            version: '1.0',
            exportTime: new Date().toISOString(),
            data: {}
        };
        // 导出所有存储项
        for (var key in Store.KEYS) {
            var storageKey = Store.KEYS[key];
            var raw = localStorage.getItem(storageKey);
            if (raw) {
                try {
                    data.data[key] = JSON.parse(raw);
                } catch(e) {
                    data.data[key] = raw;
                }
            }
        }
        var jsonStr = JSON.stringify(data, null, 2);
        var blob = new Blob([jsonStr], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        var now = new Date();
        var dateStr = now.getFullYear() + Store.pad(now.getMonth()+1) + Store.pad(now.getDate()) + '_' + Store.pad(now.getHours()) + Store.pad(now.getMinutes());
        a.href = url;
        a.download = '鲁信慧选_数据备份_' + dateStr + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        Store.addAuditLog('settings', '-', '导出系统数据');
        UI.toast('数据导出成功', 'success');
    },

    importData: function(event) {
        var file = event.target.files[0];
        if (!file) return;
        if (!file.name.endsWith('.json')) {
            UI.toast('请选择JSON格式的数据文件', 'error');
            return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var importData = JSON.parse(e.target.result);
                if (!importData.data || typeof importData.data !== 'object') {
                    UI.toast('数据文件格式不正确', 'error');
                    return;
                }
                // 统计导入数据量
                var stats = [];
                for (var key in importData.data) {
                    if (Store.KEYS[key] && importData.data[key]) {
                        var count = Array.isArray(importData.data[key]) ? importData.data[key].length : 1;
                        stats.push(key + ': ' + count + ' 条');
                    }
                }
                UI.confirm({
                    title: '确认导入数据',
                    body: '<div class="mb-8">导入将<strong style="color:var(--danger);">覆盖当前所有数据</strong>，确认继续吗？</div>' +
                          '<div class="import-stats"><div class="import-stats-title">待导入数据：</div>' +
                          stats.map(function(s){return '<div class="import-stat-item">' + s + '</div>';}).join('') +
                          '</div>',
                    danger: true,
                    okText: '确认导入',
                    onConfirm: function() {
                        // 执行导入
                        for (var key in importData.data) {
                            if (Store.KEYS[key]) {
                                var storageKey = Store.KEYS[key];
                                localStorage.setItem(storageKey, JSON.stringify(importData.data[key]));
                            }
                        }
                        Store.addAuditLog('settings', '-', '导入系统数据（文件：' + file.name + '）');
                        UI.toast('数据导入成功，正在刷新...', 'success');
                        setTimeout(function() {
                            location.reload();
                        }, 1000);
                    }
                });
            } catch(err) {
                UI.toast('数据文件解析失败：' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        // 重置input以便再次选择同一文件
        event.target.value = '';
    }
};

window.Settings = Settings;

var Auth = {
    SESSION_KEY: 'luxin_session',
    currentUser: null,

    init: function() {
        var self = this;
        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13) self.login();
        });
        document.getElementById('loginName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13) self.login();
        });
        this.checkSession();
    },

    checkSession: function() {
        var session = sessionStorage.getItem(this.SESSION_KEY);
        if (session) {
            try {
                var user = JSON.parse(session);
                var operators = Store.getOperators();
                var op = operators.filter(function(o) { return o.id === user.id; })[0];
                if (op && op.status === 'active') {
                    this.currentUser = {id: op.id, name: op.name, role: op.role, department: op.department};
                    this.showApp(op);
                    return;
                }
            } catch(e) {}
        }
        this.showLogin();
    },

    login: function() {
        var name = document.getElementById('loginName').value.trim();
        var password = document.getElementById('loginPassword').value.trim();
        var errorEl = document.getElementById('loginError');

        if (!name || !password) {
            errorEl.textContent = '请输入用户名和密码';
            return;
        }

        var operators = Store.getOperators();
        var op = operators.filter(function(o) {
            return o.name === name && o.password === password && o.status === 'active';
        })[0];

        if (op) {
            this.currentUser = {id: op.id, name: op.name, role: op.role, department: op.department};
            sessionStorage.setItem(this.SESSION_KEY, JSON.stringify(this.currentUser));
            errorEl.textContent = '';
            document.getElementById('loginName').value = '';
            document.getElementById('loginPassword').value = '';
            this.showApp(op);
            Store.addAuditLog('settings', op.name, '用户登录');
        } else {
            errorEl.textContent = '用户名或密码错误，或账号已停用';
        }
    },

    logout: function() {
        var userName = this.currentUser ? this.currentUser.name : '-';
        this.currentUser = null;
        sessionStorage.removeItem(this.SESSION_KEY);
        Store.addAuditLog('settings', userName, '用户退出登录');
        this.showLogin();
    },

    showLogin: function() {
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
        setTimeout(function() { document.getElementById('loginName').focus(); }, 100);
    },

    showApp: function(op) {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        this.updateTopbar(op);
        if (typeof Router !== 'undefined' && Router.initialized) {
            Router.navigate(Router.current);
        }
    },

    updateTopbar: function(op) {
        var userEl = document.getElementById('topbarUser');
        if (!userEl) return;
        var initial = op.name.charAt(0);
        userEl.innerHTML = '<div class="avatar">' + initial + '</div><span>' + op.name + '</span><span style="font-size:10px;margin-left:4px;">▼</span>';
        var headerEl = document.getElementById('userDropdownHeader');
        if (headerEl) headerEl.textContent = op.name + ' · ' + (op.role || '');
    },

    toggleUserMenu: function() {
        var menu = document.getElementById('userDropdownMenu');
        if (menu) {
            menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
        }
    },

    hideUserMenu: function() {
        var menu = document.getElementById('userDropdownMenu');
        if (menu) menu.style.display = 'none';
    },

    showMyRecords: function() {
        document.getElementById('userDropdownMenu').style.display = 'none';
        var user = this.getCurrentUser();
        var logs = Store.get('auditLogs').filter(function(l) { return l.operator === user.name; });

        var typeMap = {
            create_project: '新建项目', extract: '评委抽取', redraw: '重新抽取',
            edit_project: '编辑项目', delete_project: '删除项目',
            create_expert: '新增评委', edit_expert: '编辑评委', delete_expert: '删除评委',
            create_conflict: '新增回避', edit_conflict: '编辑回避', delete_conflict: '删除回避',
            settings: '系统设置', login: '登录', export: '导出'
        };

        var html = '<div class="modal-header"><span class="modal-title">我的操作记录</span><button class="modal-close" onclick="UI.hideModal()">&times;</button></div>' +
            '<div class="modal-body">' +
                '<div class="info-grid mb-16" style="background:#f8f9fb;padding:12px;border-radius:var(--radius);">' +
                    '<div class="info-item"><span class="info-label">操作人</span><span class="info-value">' + user.name + '</span></div>' +
                    '<div class="info-item"><span class="info-label">角色</span><span class="info-value">' + (user.role || '-') + '</span></div>' +
                    '<div class="info-item"><span class="info-label">操作总数</span><span class="info-value">' + logs.length + ' 次</span></div>' +
                '</div>';

        if (logs.length === 0) {
            html += '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">暂无操作记录</div></div>';
        } else {
            html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>时间</th><th>操作类型</th><th>关联项目/对象</th><th>操作详情</th></tr></thead><tbody>';
            logs.slice(0, 50).forEach(function(l) {
                html += '<tr>' +
                    '<td style="white-space:nowrap;font-size:12px;">' + l.timestamp + '</td>' +
                    '<td><span class="badge badge-info">' + (typeMap[l.action] || l.action) + '</span></td>' +
                    '<td style="font-size:12px;">' + (l.projectName || '-') + '</td>' +
                    '<td style="font-size:12px;">' + l.details + '</td>' +
                '</tr>';
            });
            html += '</tbody></table></div>';
            if (logs.length > 50) {
                html += '<div style="text-align:center;padding:12px;font-size:12px;color:var(--muted);">仅显示最近50条记录，共' + logs.length + '条</div>';
            }
        }

        html += '</div>' +
            '<div class="modal-footer"><button class="btn" onclick="UI.hideModal()">关闭</button></div>';

        UI.showModalHTML(html, 'lg');
    },

    getCurrentUser: function() {
        if (this.currentUser) return this.currentUser;
        var session = sessionStorage.getItem(this.SESSION_KEY);
        if (session) {
            try { this.currentUser = JSON.parse(session); return this.currentUser; } catch(e) {}
        }
        return { name: '系统', role: '' };
    }
};

<script>
/* ============================================
   鲁信·慧选 — 仪表盘图表
   ============================================ */
window.renderDashboardCharts = function() {
    var style = getComputedStyle(document.documentElement);
    var primary = style.getPropertyValue('--primary').trim();
    var accent = style.getPropertyValue('--accent').trim();
    var accent2 = style.getPropertyValue('--accent2').trim();
    var ink = style.getPropertyValue('--ink').trim();
    var muted = style.getPropertyValue('--muted').trim();
    var rule = style.getPropertyValue('--rule').trim();
    var bg2 = style.getPropertyValue('--bg2').trim();

    /* --- 图表1：评委专业分布（柱状图） --- */
    var chart1El = document.getElementById('chartExpertise');
    if (chart1El) {
        var experts = Store.get('experts');
        var expertiseCount = {};
        experts.forEach(function(e) {
            e.expertise.forEach(function(ex) {
                if (!expertiseCount[ex]) expertiseCount[ex] = 0;
                expertiseCount[ex]++;
            });
        });

        var categories = Object.keys(expertiseCount);
        var values = categories.map(function(k) { return expertiseCount[k]; });

        var chart1 = echarts.init(chart1El, null, { renderer: 'svg' });
        chart1.setOption({
            animation: true,
            animationDuration: 800,
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                appendToBody: true,
                formatter: function(params) {
                    return params[0].name + ': ' + params[0].value + ' 人';
                }
            },
            grid: { left: '3%', right: '5%', bottom: '3%', top: '8%', containLabel: true },
            xAxis: {
                type: 'category',
                data: categories,
                axisLabel: { color: muted, fontSize: 11, interval: 0, rotate: 15 },
                axisLine: { lineStyle: { color: rule } },
                axisTick: { show: false }
            },
            yAxis: {
                type: 'value',
                axisLabel: { color: muted, fontSize: 11 },
                axisLine: { show: false },
                splitLine: { lineStyle: { color: rule, type: 'dashed' } }
            },
            series: [{
                type: 'bar',
                data: values,
                barWidth: '50%',
                itemStyle: {
                    color: {
                        type: 'linear',
                        x: 0, y: 0, x2: 0, y2: 1,
                        colorStops: [
                            { offset: 0, color: accent2 },
                            { offset: 1, color: accent }
                        ]
                    },
                    borderRadius: [4, 4, 0, 0]
                },
                label: { show: true, position: 'top', color: ink, fontSize: 11, fontWeight: 600 }
            }]
        });
        window.addEventListener('resize', function() { chart1.resize(); });
    }

    /* --- 图表2：项目状态分布（饼图） --- */
    var chart2El = document.getElementById('chartProjectStatus');
    if (chart2El) {
        var projects = Store.get('projects');
        var statusCount = { pending: 0, extracted: 0, completed: 0 };
        projects.forEach(function(p) { statusCount[p.status] = (statusCount[p.status]||0) + 1; });

        var statusLabels = { pending: '待抽取', extracted: '已抽取', completed: '已完成' };
        var pieData = Object.keys(statusCount).map(function(k) {
            return { name: statusLabels[k], value: statusCount[k] };
        }).filter(function(d) { return d.value > 0; });

        var chart2 = echarts.init(chart2El, null, { renderer: 'svg' });
        chart2.setOption({
            animation: true,
            animationDuration: 800,
            tooltip: {
                trigger: 'item',
                appendToBody: true,
                formatter: '{b}: {c} 个 ({d}%)'
            },
            legend: {
                bottom: '2%',
                left: 'center',
                textStyle: { color: muted, fontSize: 11 },
                icon: 'circle',
                itemWidth: 8,
                itemHeight: 8
            },
            series: [{
                type: 'pie',
                radius: ['40%', '65%'],
                center: ['50%', '42%'],
                avoidLabelOverlap: false,
                itemStyle: { borderRadius: 6, borderColor: bg2, borderWidth: 2 },
                label: {
                    show: true,
                    color: ink,
                    fontSize: 11,
                    formatter: '{b}\n{c}个'
                },
                labelLine: { length: 12, length2: 12 },
                data: pieData.map(function(d, i) {
                    var colors = [accent, accent2, muted];
                    d.itemStyle = { color: colors[i % colors.length] };
                    return d;
                })
            }]
        });
        window.addEventListener('resize', function() { chart2.resize(); });
    }
};

</script>
